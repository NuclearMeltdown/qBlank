<script>
// The same as on the front page: theme and language before anything is painted.
(function(){
  try {
    var t = localStorage.getItem('qblank-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
  var l = null;
  try { l = localStorage.getItem('qblank-lang'); } catch (e) {}
  if (l === 'de') location.replace('de/' + location.pathname.split('/').pop() + location.hash);
})();
</script>
